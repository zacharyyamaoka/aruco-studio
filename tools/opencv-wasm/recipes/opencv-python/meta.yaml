# opencv-python 5.0.0.93 for Pyodide 314.0.x (pyemscripten_2026_0_wasm32).
# Derived from pyodide-recipes packages/opencv-python (4.11.0.86, commit cf85edec),
# retargeted to the 5.0.0.93 sdist and trimmed to the modules aruco-studio calls:
#   core, imgproc, imgcodecs (PNG + WebP), geometry (solvePnP/Rodrigues/projectPoints;
#   was calib3d), flann, features (was features2d; objdetect needs it), objdetect (aruco).
# Differences from the 4.11 recipe:
#   - no host libffmpeg / libwebp / libtiff, and no extras/*.cmake overrides:
#     zlib, libpng and libwebp are built from OpenCV's own 3rdparty/ sources
#     (BUILD_ZLIB/BUILD_PNG/BUILD_WEBP) instead of emscripten ports, so no
#     -sUSE_LIBPNG/-lpng-legacysjlj link flags are needed.
#   - no setuptools-unpin patch: the 5.0 sdist pins setuptools<70 for py>=3.12,
#     which works with the same wheel<0.46.1 constraint.
#   - host requirement is numpy (the xbuildenv's cross-build numpy 2.4.6 headers).
package:
  name: opencv-python
  version: 5.0.0.93
  top-level:
    - cv2
about:
  home: https://github.com/opencv/opencv-python
  PyPI: https://pypi.org/project/opencv-python
  summary: Wrapper package for OpenCV python bindings.
  license: MIT
source:
  url: https://files.pythonhosted.org/packages/79/4c/a438d23e09ce2033c09f7b784ad2fbdb0adf529e434101ed28f142226f98/opencv_python-5.0.0.93.tar.gz
  sha256: 66aac3e5b5faa48d4025816592f3af19e4bfc2c68dec067bae2dbb4ca10aa9e2
  patches:
    # the typing-stub generator refines cv.calibrateCamera; without the calib module
    # stub generation fails and setup.py aborts on the missing python/cv2/py.typed
    - patches/0001-stubs-tolerate-missing-modules.patch

requirements:
  run:
    - numpy
  host:
    - numpy
  constraint:
    # setuptools<70 (pinned by the sdist) imports wheel.bdist_wheel, removed in wheel 0.46.1
    - wheel < 0.46.1
build:
  cxxflags: |
    -DOPENCV_HAVE_FILESYSTEM_SUPPORT=1
  script: |
    export NUMPY_INCLUDE_DIR="$HOSTINSTALLDIR/lib/python$PYMAJOR.$PYMINOR/site-packages/numpy/_core/include/"
    source $PKGDIR/extras/build_args.sh
